name: Build signed Android App Bundle

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-aab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: artifacts/ruya-rehberi/android-twa

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      


      - name: Install Android build packages
        run: sdkmanager --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Configure Bubblewrap toolchain
        run: |
          mkdir -p "$HOME/.bubblewrap"
          node -e 'require("node:fs").writeFileSync(
            process.env.HOME + "/.bubblewrap/config.json",
            JSON.stringify({
              jdkPath: process.env.JAVA_HOME,
              androidSdkPath: process.env.ANDROID_HOME
            }) + "\n"
          )'

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_KEYSTORE_BASE64}" ]]; then
            echo "::error::Configure the ANDROID_KEYSTORE_BASE64 GitHub Actions secret."
            exit 1
          fi
          ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/ruya-upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
          test -s "$ANDROID_KEYSTORE_PATH"

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Configure the ${name} GitHub Actions secret."
              exit 1
            fi
          done

          npx --yes @bubblewrap/cli@1.27.0 build \
            --manifest=./twa-manifest.json \
            --signingKeyPath="$ANDROID_KEYSTORE_PATH" \
            --signingKeyAlias="$ANDROID_KEY_ALIAS"

          test -s app-release-bundle.aab

      - name: Collect bundle and upload certificate fingerprint
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          output="$PWD/release-artifacts"
          mkdir -p "$output"
          cp app-release-bundle.aab "$output/app-release-bundle.aab"

          fingerprint="$(keytool -list -v \
            -keystore "$ANDROID_KEYSTORE_PATH" \
            -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            | awk -F': ' '/SHA256:/{gsub(/[[:space:]]/, "", $2); print toupper($2); exit}')"

          if [[ ! "$fingerprint" =~ ^([A-F0-9]{2}:){31}[A-F0-9]{2}$ ]]; then
            echo "::error::Could not read a valid SHA-256 certificate fingerprint."
            exit 1
          fi
          printf '%s\n' "$fingerprint" > "$output/upload-key-sha256.txt"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: manevi-ruya-rehberi-release-${{ github.run_number }}
          path: artifacts/ruya-rehberi/android-twa/release-artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Remove temporary keystore
        if: always()
        run: rm -f "$ANDROID_KEYSTORE_PATH"
