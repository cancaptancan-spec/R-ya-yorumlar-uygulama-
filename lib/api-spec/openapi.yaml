openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dreams
    description: Private dream interpretation and locally rendered symbolic scenes
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dreams/interpret:
    post:
      operationId: interpretDream
      tags: [dreams]
      summary: Interpret a dream with careful traditional context
      description: >
        Returns a non-deterministic, respectful reflection informed by traditional
        Islamic dream literature. Dream text is not persisted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DreamInput"
      responses:
        "200":
          description: Interpretation and a structured symbolic scene theme
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DreamInterpretation"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: AI service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DreamInput:
      type: object
      properties:
        dream:
          type: string
          minLength: 10
          maxLength: 12000
        timeOfDream:
          type: string
          enum: [seher, gece, gunduz]
        dreamType:
          type: string
          enum: [huzurlu, kabus, tekrarlayan]
        username:
          type: string
          maxLength: 40
      required: [dream, timeOfDream, dreamType]
    DreamSymbol:
      type: object
      properties:
        symbol:
          type: string
        meaning:
          type: string
      required: [symbol, meaning]
    DreamInterpretation:
      type: object
      properties:
        wisdom:
          type: string
        symbols:
          type: array
          items:
            $ref: "#/components/schemas/DreamSymbol"
        detailedInterpretation:
          type: string
        dua:
          type: string
        asmaSuggestion:
          type: string
        dhikr:
          type: string
        nightmareAdvice:
          type: ["string", "null"]
        sceneTheme:
          $ref: "#/components/schemas/DreamSceneTheme"
        disclaimer:
          type: string
      required:
        - wisdom
        - symbols
        - detailedInterpretation
        - dua
        - asmaSuggestion
        - dhikr
        - nightmareAdvice
        - sceneTheme
        - disclaimer
    DreamSceneTheme:
      type: object
      properties:
        atmosphere:
          type: string
          enum: [water_moon, light_sky, nature_peace, night_stars, golden_mosque]
        primaryColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        accentColor:
          type: string
          pattern: "^#[0-9A-Fa-f]{6}$"
        sceneCaption:
          type: string
          minLength: 1
          maxLength: 180
      required: [atmosphere, primaryColor, accentColor, sceneCaption]
    ApiError:
      type: object
      properties:
        error:
          type: string
      required: [error]

